<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #2e1065; }
      body { font-family: "Inter", system-ui, sans-serif; }

      #fondo {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 70% 70%, #4c1d95 0%, #2e1065 55%, #1c0a3e 100%);
      }
      #centro {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 30px;
      }
      #titulo {
        font-size: 76px; font-weight: 800; color: #fff;
        letter-spacing: -1px; text-align: center;
      }
      #puntos {
        display: flex; gap: 56px; margin-top: 6px;
      }
      .punto {
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        color: #ddd6fe; font-size: 26px; font-weight: 600;
      }
      .punto svg { width: 44px; height: 44px; color: #c4b5fd; }

      #contacto {
        margin-top: 30px; font-size: 34px; font-weight: 600; color: #fff;
        background: rgba(126,34,206,.5);
        border: 2px solid rgba(196,181,253,.5);
        padding: 18px 44px; border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <!-- Cierre. El contacto se reemplaza desde armar.mjs: si queda un
         marcador visible en el video final, es que alguien lo pasó por alto. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="fondo" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>

      <div id="centro" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div id="titulo">Listo para su clínica</div>

        <div id="puntos">
          <div class="punto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/>
            </svg>
            <span>Consultas por voz</span>
          </div>
          <div class="punto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              <path d="M3.3 7L12 12l8.7-5M12 22V12"/>
            </svg>
            <span>Inventario y vencimientos</span>
          </div>
          <div class="punto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <path d="M2 10h20"/>
            </svg>
            <span>Ventas y caja</span>
          </div>
        </div>

        <div id="contacto">__CONTACTO__</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#titulo",   { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 0.1)
        // Los tres puntos entran uno tras otro: leídos de a uno, no de golpe.
        .from(".punto",    { opacity: 0, y: 24, duration: 0.5, stagger: 0.16, ease: "power2.out" }, 0.5)
        .from("#contacto", { opacity: 0, scale: 0.92, duration: 0.6, ease: "back.out(1.4)" }, 1.15)
        // Se queda quieto al final: es el fotograma que la gente pausa para
        // anotar el contacto.
        .to("#centro",     { opacity: 1, duration: 0.4 }, 4.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
